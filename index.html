  <style>
    h1 span { display: block; }
    .diagram {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 21rem);
      aspect-ratio: 1.25;
      justify-self: end;
      color: var(--accent);
      background: radial-gradient(circle, #b9c3b2 1px, transparent 1.2px) center / 1rem 1rem;
    }
    .diagram::before, .diagram::after {
      position: absolute;
      width: 1.2rem;
      height: 1.2rem;
      border: solid var(--accent);
      content: "";
    }
    .diagram::before { inset: 0 auto auto 0; border-width: 1px 0 0 1px; }
    .diagram::after { inset: auto 0 0 auto; border-width: 0 1px 1px 0; }
    .lanes { display: grid; gap: clamp(.55rem, 1.1vw, .9rem); width: 66%; }
    .lane {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      isolation: isolate;
      gap: clamp(.35rem, .8vw, .7rem);
    }
    .lane::before {
      position: absolute;
      z-index: -1;
      inset: 50% -.9rem auto -.9rem;
      border-top: 1px solid #687f68;
      content: "";
    }
    .lane::after {
      position: absolute;
      top: 50%;
      right: -.9rem;
      width: .3rem;
      height: .3rem;
      border: solid var(--accent);
      border-width: 1px 1px 0 0;
      transform: translateY(-50%) rotate(45deg);
      content: "";
    }
    .lane span {
      aspect-ratio: 1.5;
      background: #eceee3;
      border: 1px solid #748571;
    }
    .lane .on { background: var(--accent); border-color: var(--accent); }
    .lane .mid { background: #b5c3a9; }

    .edition {
      margin: 0;
      font: 700 clamp(1.35rem, 3vw, 2rem)/1.3 var(--title-font);
    }
    .edition time { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .summary { max-width: 42rem; margin: 0; color: var(--muted); }
    .latest .summary { margin-top: .75rem; }
    .read {
      margin-top: 1.15rem;
      padding: .48rem .95rem;
      border-radius: .25rem;
      color: white;
      background: var(--accent);
      text-decoration: none;
      transition: background-color 150ms ease;
    }
    .read:hover { background: #254433; }
    .archive-link { margin-top: .55rem; }
    .guestbook-link { margin-top: .4rem; }
    #guestbook .giscus { margin-top: 1.25rem; }

    @media (max-width: 42rem) {
      .diagram { width: min(100%, 16rem); aspect-ratio: 1.65; justify-self: start; }
      .lane span { aspect-ratio: 2.25; }
    }
  </style>
