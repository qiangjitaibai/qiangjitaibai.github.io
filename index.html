<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="羟基太白的处理器架构与矢量设计周报。查看最新一期和往期归档。">
  <title>处理器架构与矢量设计周报 · 羟基太白</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0a0a0f;
      --surface: #141722;
      --line: #30354a;
      --text: #f5f5fb;
      --muted: #aeb5cb;
      --accent: #accdff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font: 1rem/1.65 Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    main { width: min(64rem, calc(100% - 3rem)); margin: 0 auto; padding: clamp(2rem, 6vw, 4.75rem) 0; }
    a { color: var(--accent); text-underline-offset: .22em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .name { color: var(--muted); margin: 0 0 clamp(1.7rem, 4vw, 3.25rem); font-size: .9rem; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.7rem); line-height: 1.15; text-wrap: balance; }
    .intro { margin: .9rem 0 0; color: var(--muted); }
    .lead { margin-top: clamp(1.8rem, 4vw, 2.7rem); display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); gap: 1rem; }
    .current, .history { padding: clamp(1.2rem, 3.2vw, 2.1rem); border: 1px solid var(--line); border-radius: 1rem; }
    .current { background: var(--surface); border-color: #465b81; }
    .history { display: flex; flex-direction: column; justify-content: space-between; background: #10111a; }
    h2 { margin: 0; font-size: clamp(1.25rem, 2.5vw, 1.65rem); line-height: 1.35; }
    .edition { color: var(--accent); margin: .8rem 0 0; font-weight: 650; font-variant-numeric: tabular-nums; }
    .summary, .history p { color: var(--muted); margin: .65rem 0 0; }
    .read { display: inline-flex; align-items: center; gap: 1rem; margin-top: 1.1rem; font-weight: 650; }
    .history h2 a { text-decoration: none; }
    .history h2 a:hover { text-decoration: underline; }
    .history h2 span { margin-left: .25rem; }
    .secondary { margin-top: clamp(2.5rem, 6vw, 4.5rem); padding-top: 1.2rem; border-top: 1px solid var(--line); }
    .secondary ul { margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .8rem 1.75rem; list-style: none; }
    .secondary a { color: var(--muted); }
    .secondary a:hover { color: var(--accent); }
    @media (max-width: 43rem) {
      main { width: min(64rem, calc(100% - 2rem)); }
      .lead { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="name">羟基太白</p>
      <h1>处理器架构与矢量设计周报</h1>
      <p class="intro">论文、开源项目、架构规范、专利与 AI 工程实践。</p>
    </header>
    <div class="lead">
      <section class="current" aria-labelledby="current-title">
        <h2 id="current-title">周报</h2>
        <div>
            <!-- WEEKLY-LATEST:START -->
            <p class="summary">首期正在筹备，发布后将在这里展示。</p>
            <!-- WEEKLY-LATEST:END -->
        </div>
      </section>
      <section class="history" aria-labelledby="history-title">
        <div>
          <h2 id="history-title"><a href="/weekly/">往期周报 <span aria-hidden="true">↗</span></a></h2>
          <p>按期查看已发布的周报。</p>
        </div>
      </section>
    </div>
    <nav class="secondary" aria-label="个人资料与课程">
      <ul>
        <li><a href="/about/">自我简介</a></li>
        <li><a href="/courses/">课程链接</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
